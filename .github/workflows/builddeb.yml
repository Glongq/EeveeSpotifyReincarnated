name: Build Pixie rootless + RootHide DEBs

run-name: Pixie DEBs — ${{ github.ref_name }}

on:
  push:
    branches: [pixie-debs]
  workflow_dispatch:

permissions:
  contents: read

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"
  PACKAGE_VERSION: "7.5.0+pixie.deb2"
  PIXIE_JAILBREAK: "1"

jobs:
  build-debs:
    name: Build ${{ matrix.label }} .deb
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            label: rootless
            theos_repository: theos/theos
          - scheme: roothide
            label: RootHide
            theos_repository: roothide/theos

    env:
      THEOS: ${{ github.workspace }}/Outputs/BuildTools/theos-${{ matrix.scheme }}
      THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3.0"

      - name: Checkout ${{ matrix.label }} Theos
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.theos_repository }}
          path: Outputs/BuildTools/theos-${{ matrix.scheme }}
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Verify prepared Pixie plan and Metal tools
        run: |
          python3 NativeDownloads/tools/build_jailbreak.py \
            --plan-dir NativeDownloads/jailbreak/plans/spotify-9.2.0 \
            --export-plan "$RUNNER_TEMP/verified-plan"
          if ! xcrun -sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk iphoneos metal --version
          xcrun -sdk iphoneos --find metallib

      - name: Build EeveeSwiftProtobuf.framework
        env:
          SRC_DIR: ${{ runner.temp }}/swift-protobuf-${{ matrix.scheme }}
        run: make build-eeveeswiftprotobuf

      - name: Test ad and Premium banner filtering
        run: |
          swiftc \
            Sources/EeveeSpotify/Premium/Helpers/BrowsitaSectionStripper.swift \
            Tests/BrowsitaSectionStripper/main.swift \
            -o "$RUNNER_TEMP/browsita-section-stripper-tests"
          "$RUNNER_TEMP/browsita-section-stripper-tests"
          swiftc \
            Sources/EeveeSpotify/Shared/Models/Extensions/URL+Extension.swift \
            Tests/URLAdClassification/main.swift \
            -o "$RUNNER_TEMP/url-ad-classification-tests"
          "$RUNNER_TEMP/url-ad-classification-tests"
          swiftc \
            Sources/EeveeSpotify/Premium/Helpers/ServerSidedFeaturePolicy.swift \
            Tests/ServerSidedFeaturePolicy/main.swift \
            -o "$RUNNER_TEMP/server-sided-feature-policy-tests"
          "$RUNNER_TEMP/server-sided-feature-policy-tests"
          swiftc \
            Sources/EeveeSpotify/Premium/Helpers/BundledConfigurationPolicy.swift \
            Tests/BundledConfigurationPolicy/main.swift \
            -o "$RUNNER_TEMP/bundled-configuration-policy-tests"
          "$RUNNER_TEMP/bundled-configuration-policy-tests"
          swiftc \
            Sources/EeveeSpotify/Shared/Models/VersionHookTarget.swift \
            Tests/VersionHookTarget/main.swift \
            -o "$RUNNER_TEMP/version-hook-target-tests"
          "$RUNNER_TEMP/version-hook-target-tests"
          swiftc \
            Tests/CustomTabsActivation/main.swift \
            -o "$RUNNER_TEMP/custom-tabs-activation-tests"
          "$RUNNER_TEMP/custom-tabs-activation-tests"
          swiftc \
            Tests/HookSourceAudit/main.swift \
            -o "$RUNNER_TEMP/hook-source-audit-tests"
          "$RUNNER_TEMP/hook-source-audit-tests"
          python3 Tests/ResolveConfigurationSnapshot/test.py

      - name: Check guarded Pixie runtime helpers
        run: |
          python3 NativeDownloads/tools/test.py \
            --fixture jailbreak_identity --fixture jailbreak_patches --fixture jailbreak_import_memory \
            --build-dir Outputs/DEBS/runtime-tests-${{ matrix.scheme }}

      - name: Build ${{ matrix.label }} .deb
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}"
          ls -la packages

      - name: Stage and validate ${{ matrix.label }} artifact
        env:
          SCHEME: ${{ matrix.scheme }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p Outputs/DEBS
          if [ "$SCHEME" = roothide ]; then ARCH=iphoneos-arm64e; else ARCH=iphoneos-arm64; fi
          DEB_PATH="Outputs/DEBS/EeveeSpotify-${PACKAGE_VERSION}-${LABEL}.deb"
          cp "packages/com.eevee.spotify_${PACKAGE_VERSION}_${ARCH}.deb" "$DEB_PATH"
          python3 NativeDownloads/tools/validate_jailbreak_deb.py "$DEB_PATH" \
            --scheme "$SCHEME" --build-dir ".theos/pixie-${SCHEME}"
          python3 - "$DEB_PATH" <<'PYTHON'
          import runpy, sys
          from pathlib import Path
          runpy.run_path('Scripts/build-pixie-debs-local.py')['validate_shader'](Path(sys.argv[1]))
          print('PASS: compiled karaoke vertex and fragment functions')
          PYTHON
          cp ".theos/pixie-${SCHEME}/build.json" "Outputs/DEBS/${SCHEME}-companion-build.json"
          cp ".theos/pixie-${SCHEME}/JailbreakPlan.h" "Outputs/DEBS/${SCHEME}-JailbreakPlan.h"
          git archive --format=tar.gz --output="Outputs/DEBS/${SCHEME}-sources.tar.gz" HEAD
          shasum -a 256 "$DEB_PATH" > "${DEB_PATH}.sha256"

      - name: Upload ${{ matrix.label }} artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pixie-${{ matrix.label }}-DEB
          path: Outputs/DEBS/
          if-no-files-found: error
          retention-days: 14
