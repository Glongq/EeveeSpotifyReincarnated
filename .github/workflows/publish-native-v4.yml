name: Publish Native Downloads v4 source release

on:
  push:
    branches:
      - Master
    paths:
      - '.github/workflows/publish-native-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-native-v4
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub source release
    if: github.repository == 'Glongq/EeveeSpotifyReincarnated'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish prerelease if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view native-v4 >/dev/null 2>&1; then
            echo "Release native-v4 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create native-v4 \
            --target "$GITHUB_SHA" \
            --title "EeveeSpotify Native Downloads v4" \
            --notes-file RELEASE_NOTES-native-v4.md \
            --prerelease
          gh release view native-v4 --json url,tagName,name,isPrerelease
