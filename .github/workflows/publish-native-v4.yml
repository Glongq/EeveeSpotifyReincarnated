name: Sync Native Downloads v4 release notes

on:
  push:
    branches:
      - Master
    paths:
      - 'RELEASE_NOTES-native-v4.md'
      - '.github/workflows/publish-native-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-native-v4
  cancel-in-progress: false

jobs:
  sync-notes:
    name: Update existing native-v4 release
    if: github.repository == 'Glongq/EeveeSpotifyReincarnated'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit release notes in place
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view native-v4 >/dev/null
          gh release edit native-v4 --notes-file RELEASE_NOTES-native-v4.md
          gh release view native-v4 --json url,tagName,name,isPrerelease
